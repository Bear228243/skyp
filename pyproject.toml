[tool.poetry]
name = "banking-widget"
version = "0.1.0"
description = "Backend for banking widget showing recent transactions."
authors = ["Matvey Skrjbin <skrjbin557@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"

[tool.poetry.scripts]
test = "pytest"
test-cov = "pytest --cov=src"
lint = "flake8 src/"
type-check = "mypy src/"
format = "isort src/ &&"

# Добавьте эту секцию для настройки pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=html:coverage_html",
    "--cov-report=term-missing",
    "-v"
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.black]
line-length = 119
exclude = '''
(
  \.git
)
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]

# Добавьте эту секцию для ковеража
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"