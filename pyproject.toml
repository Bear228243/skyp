[tool.poetry]
name = "banking-widget"
version = "0.1.0"
description = "Backend for banking widget showing recent transactions."
authors = ["Matvey Skrjbin <skrjbin557@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"

[tool.black]
line-length = 119
exclude = '''
(
  \.git
)
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"