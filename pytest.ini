[pytest]
pythonpath = .
testpaths = tests
addopts = --verbose --cov=src --cov-report=html
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --color=yes
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html
# Определение маркеров для тестов
markers =
    slow: отмечает тесты как медленные (можно исключить через '-m "not slow"')
    integration: отмечает тесты как интеграционные